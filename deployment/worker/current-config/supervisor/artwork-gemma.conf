[program:artwork-gemma]
command=/bin/bash /workspace/artwork/judges/start_gemma.sh
directory=/workspace/artwork/judges
autostart=true
autorestart=unexpected
startsecs=10
startretries=2
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
