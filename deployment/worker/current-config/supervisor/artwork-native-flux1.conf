[program:artwork-native-flux1]
command=/opt/supervisor-scripts/artwork-native-flux1.sh
autostart=false
autorestart=unexpected
priority=10
startsecs=1
stopwaitsecs=900
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/portal/artwork-native-flux1.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
