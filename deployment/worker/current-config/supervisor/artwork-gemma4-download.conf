[program:artwork-gemma4-download]
command=/workspace/artwork/.download-venv/bin/python /workspace/artwork/judges/download_gemma4.py
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=CUDA_VISIBLE_DEVICES="",HF_HUB_DISABLE_PROGRESS_BARS="1",HF_HUB_DISABLE_TELEMETRY="1"
