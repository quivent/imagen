[program:artwork-encoder-fp8-download]
command=/workspace/artwork/.download-venv/bin/python -u /workspace/artwork/download_encoder_fp8.py
environment=HF_HOME="/workspace/artwork/hf",HF_HUB_DISABLE_PROGRESS_BARS="1"
autostart=false
autorestart=unexpected
startretries=5
startsecs=1
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/portal/artwork-encoder-fp8-download.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
