[program:artwork-flux2]
command=/opt/supervisor-scripts/artwork-flux2.sh
autostart=false
autorestart=unexpected
priority=20
startsecs=1
stopwaitsecs=900
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/portal/artwork-flux2.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
